<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Anotador de Truco</title>
<meta name="theme-color" content="#2b1a10" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Truco">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--fg:#fff;--line:#9a7226;--acc:#f7c21c;--hdr:#2b1a10;--hdrline:#b8892c;--pat:rgba(255,200,90,.07);
        --btn:#fff;--rip:rgba(255,255,255,.4);--mf:drop-shadow(0 2px 2px rgba(0,0,0,.65));
        --nbg:rgba(20,12,8,.85);--nfg:#fff;--nbd:#b8892c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;background:#1e120b;overflow:hidden;overscroll-behavior:none}
  body{font-family:'Titillium Web',system-ui,sans-serif;color:var(--fg)}
  #bgc{position:fixed;inset:0;width:100%;height:100%;z-index:0}
  #app{position:relative;z-index:1;max-width:520px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;
       box-shadow:0 0 60px rgba(0,0,0,.45)}
  header{position:relative;z-index:5;flex:none;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;
    padding:env(safe-area-inset-top) 14px 0;height:calc(clamp(56px,9vh,76px) + env(safe-area-inset-top));
    border-bottom:2px solid var(--hdrline);
    background:
      radial-gradient(circle at 50% 120%,transparent 0 9px,var(--pat) 10px 11px,transparent 12px) 0 0/26px 26px,
      radial-gradient(circle at 0% 100%,transparent 0 9px,var(--pat) 10px 11px,transparent 12px) 0 0/26px 26px,
      var(--hdr);transition:background-color .3s}
  header h1{margin:0;text-align:center;font-weight:400;font-size:clamp(22px,5.4vw,28px);color:var(--acc);letter-spacing:.3px}
  #menuBtn{justify-self:end;width:36px;height:36px;border:1.5px solid var(--hdrline);border-radius:50%;background:none;display:grid;place-items:center;cursor:pointer;padding:0}
  #menuBtn svg{width:20px;height:20px;stroke:var(--acc);fill:none;stroke-width:1.8;stroke-linecap:round}
  #menuBtn:active{background:rgba(255,255,255,.12)}
  #menu{position:absolute;right:10px;top:calc(100% + 8px);min-width:210px;padding:8px;border-radius:12px;
    background:rgba(25,16,10,.96);border:1.5px solid #b8892c;box-shadow:0 10px 30px rgba(0,0,0,.55);
    transform-origin:top right;animation:pop .18s ease-out}
  #menu{max-height:calc(100dvh - 120px);overflow-y:auto}
  #menu[hidden]{display:none}
  @keyframes pop{from{opacity:0;transform:scale(.92) translateY(-6px)}}
  #menu .t{font-size:13px;color:#d6a431;padding:4px 10px 6px;letter-spacing:.5px;text-transform:uppercase}
  .opt{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:none;color:#fff;
    font:400 18px 'Titillium Web',sans-serif;cursor:pointer;text-align:left}
  .opt:active{background:rgba(255,255,255,.1)}
  .opt.sel{background:rgba(247,194,28,.14)}
  .sw{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.7);flex:none;position:relative;overflow:hidden}
  .sw i{position:absolute;inset:0;clip-path:polygon(100% 0,100% 100%,0 100%)}
  .ck{margin-left:auto;color:#f7c21c;opacity:0}
  .opt.sel .ck{opacity:1}
  main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center}
  #board{width:100%;flex:none;display:block;touch-action:manipulation}
  .lbl{font:400 46px 'Titillium Web',sans-serif;fill:var(--fg);text-anchor:middle;transition:fill .3s}
  .gl{stroke:var(--line);stroke-width:2.5}
  .tap{fill:transparent;cursor:pointer}
  .btn circle{fill:rgba(0,0,0,.001);stroke:var(--btn);stroke-width:4.5;transition:fill .15s}
  .btn path{stroke:var(--btn);stroke-width:5;stroke-linecap:round;fill:none}
  .btn{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .12s}
  .btn:active{transform:scale(.88)}
  .btn:active circle{fill:var(--rip)}
  .matches{filter:var(--mf)}
  .m{transform-box:fill-box;transform-origin:center}
  .m.in{animation:drop .42s cubic-bezier(.2,.9,.3,1.25) both}
  .m.out{animation:away .34s ease-in forwards}
  @keyframes drop{0%{opacity:0;transform:translate(0,-34px) rotate(50deg) scale(1.6)}
                  60%{opacity:1}100%{opacity:1;transform:none}}
  @keyframes away{to{opacity:0;transform:translate(0,40px) rotate(-70deg) scale(.7)}}
  .rip{fill:var(--rip);transform-box:fill-box;transform-origin:center;animation:rip .45s ease-out forwards;pointer-events:none}
  @keyframes rip{from{opacity:.9;transform:scale(.4)}to{opacity:0;transform:scale(2.6)}}
  .win{animation:glow 1s ease-in-out infinite alternate}
  @keyframes glow{from{fill:var(--fg)}to{fill:var(--acc)}}
  #spacer{flex:1}
  .brow{flex:none;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:0 10px;margin-bottom:calc(clamp(20px,5vh,54px) + env(safe-area-inset-bottom))}
  .brow #nuevo,.brow #histBtn{margin-bottom:0;padding:9px 16px}
  #nuevo,#histBtn{flex:none;margin-bottom:calc(clamp(20px,5vh,54px) + env(safe-area-inset-bottom));padding:9px 20px;font:400 18px 'Titillium Web',sans-serif;
    color:var(--nfg);background:var(--nbg);border:1.5px solid var(--nbd);border-radius:9px;cursor:pointer;transition:transform .12s}
  #nuevo:active,#histBtn:active{transform:scale(.94)}
  #hsheet{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end}
  #hsheet[hidden]{display:none}
  #hsheet .back{flex:1;background:rgba(0,0,0,.5)}
  #hsheet .panel{background:var(--hdr);color:var(--nfg);border-top:2px solid var(--hdrline);padding:14px 14px calc(14px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0;animation:up .2s ease-out;text-align:center;max-height:75dvh;display:flex;flex-direction:column}
  #hsheet .st{font-size:20px;color:var(--acc)}
  #hsheet .hl{overflow-y:auto;text-align:left;margin:10px 0 12px;-webkit-overflow-scrolling:touch}
  .he{display:flex;gap:12px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:17px}
  .he time{color:var(--acc);font-variant-numeric:tabular-nums;flex:none}
  .he.empty{justify-content:center;opacity:.7;border:0}

  /* ---- menú: páginas ---- */
  .opt .chev{margin-left:auto;color:var(--acc,#f7c21c);font-size:22px;line-height:1}
  .opt.back{color:#d6a431;font-size:16px;border-bottom:1px solid rgba(214,164,49,.3);border-radius:8px 8px 0 0;margin-bottom:4px}
  .opt.back span{width:28px;text-align:center;font-size:22px}
  .sw.plus{display:grid;place-items:center;font-size:20px;line-height:1;background:rgba(255,255,255,.12);color:#f7c21c}

  /* ---- otros juegos ---- */
  .view{display:none;flex:1;min-height:0;width:100%;overflow-y:auto;padding:12px 14px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;color:var(--fg)}
  body[data-game=generala] #vGenerala,body[data-game=escoba] #vEscoba,body[data-game=chinchon] #vChinchon{display:block}
  body:not([data-game=truco]) #board,body:not([data-game=truco]) #spacer,body:not([data-game=truco]) #brow{display:none}
  .card{background:var(--nbg);color:var(--nfg);border:1.5px solid var(--nbd);border-radius:12px;padding:10px;margin-bottom:12px}
  .b{font:400 17px 'Titillium Web',sans-serif;color:var(--nfg);background:transparent;border:1.5px solid var(--nbd);border-radius:10px;padding:9px 12px;cursor:pointer;transition:transform .1s;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .b:active{transform:scale(.94)}
  .b.on{background:var(--acc);color:var(--hdr);border-color:var(--acc)}
  .b.sm{padding:4px 13px;font-size:22px;line-height:1.1}
  .b:disabled{opacity:.4}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:4px 0 6px}
  .seg{display:flex;gap:8px;align-items:center;margin-bottom:12px;color:var(--fg);font-size:17px}
  .seg span{margin-right:4px}
  .seg .b{padding:6px 16px}
  .ban{background:var(--acc);color:var(--hdr);text-align:center;padding:10px;border-radius:10px;margin-bottom:12px;font-size:19px;animation:pop .25s ease-out}
  input.nm,input.ni{user-select:text;-webkit-user-select:text;background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--nfg);font:400 16px 'Titillium Web',sans-serif;text-align:center;width:100%;padding:3px 0;border-radius:0;outline:none}
  input.nm:focus,input.ni:focus{border-bottom:1.5px solid var(--acc)}
  .t2{color:var(--acc);font-size:14px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
  .gt{width:100%;border-collapse:collapse;table-layout:fixed;font-size:18px}
  .gt th{padding:2px 4px 6px;font-weight:400}
  .gt td{border-top:1px solid var(--line);text-align:center;height:38px;padding:0}
  .gt td.rl{width:88px;text-align:left;padding-left:6px;color:var(--acc);font-size:16px}
  .gt td.neg{color:var(--acc)}
  .gt td.out{text-decoration:line-through;opacity:.6}
  .gt td.out small{display:block;text-decoration:none;font-size:11px}
  .gt tr.tot td{font-weight:600;font-size:22px;border-top:2px solid var(--nbd);height:44px}
  .gt td.lead{color:var(--acc)}
  .cell{width:100%;height:100%;min-height:38px;background:none;border:0;color:var(--nfg);font:inherit;cursor:pointer}
  .cell:active{background:rgba(127,127,127,.3)}
  .cell.x{opacity:.5}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pl{text-align:center}
  .big{font-size:56px;line-height:1.1;margin:4px 0}
  .big.lead{color:var(--acc)}
  .pm{display:flex;gap:10px;justify-content:center}
  .rw{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:8px;align-items:center;margin:7px 0}
  .ctr{display:flex;align-items:center;justify-content:space-between;gap:4px}
  .ctr b{font-size:22px;font-weight:600;min-width:20px;text-align:center}
  .prev{text-align:center;margin:8px 0;color:var(--acc)}
  .hist div{padding:3px 0;border-bottom:1px solid var(--line)}
  .hist div:last-child{border:0}
  .ins{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;margin:6px 0 10px}
  .in{display:flex;flex-direction:column;gap:6px;align-items:center}
  .in.out{opacity:.5;justify-content:center;height:100%}
  .in .b.sm{font-size:15px;padding:3px 10px}
  #sheet{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end}
  #sheet[hidden]{display:none}
  #sheet .back{flex:1;background:rgba(0,0,0,.5)}
  #sheet .panel{background:var(--hdr);color:var(--nfg);border-top:2px solid var(--hdrline);padding:14px 14px calc(14px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0;animation:up .2s ease-out;text-align:center}
  #sheet .st{font-size:20px;color:var(--acc)}
  #sheet .sb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
  @keyframes up{from{transform:translateY(40px);opacity:0}}
</style>
</head>
<body data-game="truco">
<canvas id="bgc"></canvas>
<div id="app">
  <header>
    <span></span>
    <h1 id="title">Anotador</h1>
    <button id="menuBtn" aria-label="Estilos" aria-haspopup="true"><svg viewBox="0 0 24 24"><path d="M6 8h12M6 12h12M6 16h12"/></svg></button>
    <div id="menu" hidden></div>
  </header>
  <main>
    <svg id="board" viewBox="0 0 720 740" aria-label="Anotador de truco">
      <rect class="tap" data-t="0" x="0" y="80" width="360" height="660"/>
      <rect class="tap" data-t="1" x="360" y="80" width="360" height="660"/>
      <line class="gl" x1="150" y1="80" x2="570" y2="80"/>
      <line class="gl" x1="150" y1="398" x2="570" y2="398"/>
      <line class="gl" x1="360" y1="10" x2="360" y2="720"/>
      <text class="lbl" id="l0" x="255" y="62">Nos:</text>
      <text class="lbl" id="l1" x="465" y="62">Ellos:</text>
      <g class="matches" id="g0" pointer-events="none"></g>
      <g class="matches" id="g1" pointer-events="none"></g>
      <g id="rips" pointer-events="none"></g>
      <g class="btn" data-t="0" data-d="1"><circle cx="90" cy="355" r="36"/><path d="M72 355h36M90 337v36"/></g>
      <g class="btn" data-t="0" data-d="-1"><circle cx="90" cy="445" r="36"/><path d="M72 445h36"/></g>
      <g class="btn" data-t="1" data-d="1"><circle cx="630" cy="355" r="36"/><path d="M612 355h36M630 337v36"/></g>
      <g class="btn" data-t="1" data-d="-1"><circle cx="630" cy="445" r="36"/><path d="M612 445h36"/></g>
    </svg>
    <div id="spacer"></div>
    <div class="brow" id="brow"><button id="nuevo">Nuevo partido</button><button id="histBtn" data-act="hist">Historial de puntos</button></div>
    <section class="view" id="vGenerala"></section>
    <section class="view" id="vEscoba"></section>
    <section class="view" id="vChinchon"></section>
  </main>
  <div id="sheet" hidden>
    <div class="back" data-act="closesheet"></div>
    <div class="panel"><div class="st" id="sheetT"></div><div class="sb" id="sheetB"></div><button class="b" data-act="closesheet">Cancelar</button></div>
  </div>
  <div id="hsheet" hidden>
    <div class="back" data-act="closesheet"></div>
    <div class="panel"><div class="st" id="hT"></div><div class="hl" id="hL"></div><button class="b" data-act="closesheet">Cerrar</button></div>
  </div>
</div>

<script>
// ---------- estilos ----------
const MATCH={type:'match',body:'#ecd9a8',shade:'#b9a06a',head:'#c8281c',hl:'#ff6a4a',T:5};
const THEMES={
  madera:{name:'Madera',bg:'wood',sw:['#4a2a1a','#ecd9a8'],tc:'#2b1a10',
    css:{'--fg':'#fff','--line':'#9a7226','--acc':'#f7c21c','--hdr':'#2b1a10','--hdrline':'#b8892c','--pat':'rgba(255,200,90,.07)','--btn':'#fff','--rip':'rgba(255,255,255,.4)','--mf':'drop-shadow(0 2px 2px rgba(0,0,0,.65))','--nbg':'rgba(20,12,8,.85)','--nfg':'#fff','--nbd':'#b8892c'},
    mark:MATCH},
  pano:{name:'Paño verde',bg:'felt',sw:['#1c6b3c','#ecd9a8'],tc:'#0f3d22',
    css:{'--fg':'#fff','--line':'#d9c27a','--acc':'#ffe28a','--hdr':'#0f3d22','--hdrline':'#d9c27a','--pat':'rgba(255,240,170,.08)','--btn':'#fff','--rip':'rgba(255,255,255,.4)','--mf':'drop-shadow(0 2px 2px rgba(0,0,0,.6))','--nbg':'rgba(8,40,22,.85)','--nfg':'#fff','--nbd':'#d9c27a'},
    mark:MATCH},
  pizarra:{name:'Pizarrón',bg:'chalk',sw:['#2b3a35','#ffffff'],tc:'#1b2622',
    css:{'--fg':'#f3f3ee','--line':'rgba(255,255,255,.5)','--acc':'#f3f3ee','--hdr':'#1b2622','--hdrline':'rgba(255,255,255,.55)','--pat':'rgba(255,255,255,.04)','--btn':'#f3f3ee','--rip':'rgba(255,255,255,.35)','--mf':'drop-shadow(0 0 2px rgba(255,255,255,.35))','--nbg':'rgba(20,28,25,.8)','--nfg':'#f3f3ee','--nbd':'rgba(255,255,255,.6)'},
    mark:{type:'chalk',body:'#f7f7f2',T:5}},
  papel:{name:'Papel y birome',bg:'paper',sw:['#f4eedc','#1d3b8b'],tc:'#e9e0c4',
    css:{'--fg':'#222','--line':'#7d8aa8','--acc':'#1d3b8b','--hdr':'#e9e0c4','--hdrline':'#a89a6c','--pat':'rgba(120,100,50,.1)','--btn':'#222','--rip':'rgba(29,59,139,.25)','--mf':'none','--nbg':'rgba(255,252,240,.9)','--nfg':'#222','--nbd':'#7d8aa8'},
    mark:{type:'ink',body:'#1d3b8b',T:4}},
  noche:{name:'Noche dorada',bg:'night',sw:['#0d1b33','#f7c21c'],tc:'#0a1428',
    css:{'--fg':'#fff','--line':'rgba(247,194,28,.55)','--acc':'#f7c21c','--hdr':'#0a1428','--hdrline':'rgba(247,194,28,.7)','--pat':'rgba(247,194,28,.06)','--btn':'#fff','--rip':'rgba(247,194,28,.4)','--mf':'drop-shadow(0 0 5px rgba(247,194,28,.55))','--nbg':'rgba(8,16,36,.85)','--nfg':'#fff','--nbd':'rgba(247,194,28,.7)'},
    mark:{type:'glow',body:'#ffd24a',T:5}},
  cuero:{name:'Cuero',bg:'leather',sw:['#5a3420','#e8d8a8'],tc:'#3a2013',
    css:{'--fg':'#fff3d6','--line':'#d8c28a','--acc':'#f1d98f','--hdr':'#3a2013','--hdrline':'#d8c28a','--pat':'rgba(255,230,170,.07)','--btn':'#fff3d6','--rip':'rgba(255,240,200,.4)','--mf':'drop-shadow(0 2px 2px rgba(0,0,0,.65))','--nbg':'rgba(40,22,12,.85)','--nfg':'#fff3d6','--nbd':'#d8c28a'},
    mark:MATCH},
  marmol:{name:'Mármol',bg:'marble',sw:['#eceae6','#222'],tc:'#dcd9d2',
    css:{'--fg':'#1f1f1f','--line':'#8a8478','--acc':'#7a5a12','--hdr':'#dcd9d2','--hdrline':'#9c9484','--pat':'rgba(90,80,60,.08)','--btn':'#1f1f1f','--rip':'rgba(0,0,0,.2)','--mf':'drop-shadow(0 1px 1.5px rgba(0,0,0,.35))','--nbg':'rgba(250,248,244,.92)','--nfg':'#1f1f1f','--nbd':'#8a8478'},
    mark:{type:'ink',body:'#1c1c1c',T:4.5}},
  celeste:{name:'Celeste y blanco',bg:'celeste',sw:['#4aa3df','#ffffff'],tc:'#2c7fb8',
    css:{'--fg':'#fff','--line':'rgba(255,255,255,.7)','--acc':'#fff','--hdr':'#2c7fb8','--hdrline':'rgba(255,255,255,.8)','--pat':'rgba(255,255,255,.08)','--btn':'#fff','--rip':'rgba(255,255,255,.45)','--mf':'drop-shadow(0 2px 2px rgba(0,50,100,.55))','--nbg':'rgba(20,90,150,.75)','--nfg':'#fff','--nbd':'rgba(255,255,255,.85)'},
    mark:{type:'chalk',body:'#ffffff',T:5.5}},
  terciopelo:{name:'Terciopelo',bg:'velvet',sw:['#6b0f1a','#e9d8a6'],tc:'#3f0810',
    css:{'--fg':'#fff','--line':'#d9b45a','--acc':'#f3cf73','--hdr':'#3f0810','--hdrline':'#d9b45a','--pat':'rgba(243,207,115,.08)','--btn':'#fff','--rip':'rgba(255,255,255,.35)','--mf':'drop-shadow(0 2px 2px rgba(0,0,0,.6))','--nbg':'rgba(50,6,14,.85)','--nfg':'#fff','--nbd':'#d9b45a'},
    mark:MATCH},
  neon:{name:'Neón',bg:'carbon',sw:['#141414','#39ff88'],tc:'#0b0b0b',
    css:{'--fg':'#fff','--line':'rgba(57,255,136,.55)','--acc':'#39ff88','--hdr':'#0b0b0b','--hdrline':'rgba(57,255,136,.7)','--pat':'rgba(57,255,136,.05)','--btn':'#39ff88','--rip':'rgba(57,255,136,.4)','--mf':'drop-shadow(0 0 5px rgba(57,255,136,.7))','--nbg':'rgba(10,10,10,.85)','--nfg':'#39ff88','--nbd':'rgba(57,255,136,.7)'},
    mark:{type:'glow',body:'#7dffb4',T:5}},
  atardecer:{name:'Atardecer',bg:'atardecer',sw:['#c4455a','#ffd9a0'],tc:'#2a1a4a',
    css:{'--fg':'#fff','--line':'rgba(255,235,200,.6)','--acc':'#ffe3a8','--hdr':'#2a1a4a','--hdrline':'rgba(255,200,150,.7)','--pat':'rgba(255,200,150,.07)','--btn':'#fff','--rip':'rgba(255,255,255,.4)','--mf':'drop-shadow(0 2px 3px rgba(60,10,40,.55))','--nbg':'rgba(50,15,50,.72)','--nfg':'#fff','--nbd':'rgba(255,220,180,.7)'},
    mark:{type:'chalk',body:'#fff6e6',T:5.5}},
  bosque:{name:'Bosque',bg:'bosque',sw:['#1d4a2c','#ecd9a8'],tc:'#0b2014',
    css:{'--fg':'#fff','--line':'#b9d79a','--acc':'#cdeb9c','--hdr':'#0b2014','--hdrline':'#b9d79a','--pat':'rgba(200,240,150,.06)','--btn':'#fff','--rip':'rgba(255,255,255,.4)','--mf':'drop-shadow(0 2px 2px rgba(0,0,0,.6))','--nbg':'rgba(6,28,14,.82)','--nfg':'#fff','--nbd':'#b9d79a'},

const NS='http://www.w3.org/2000/svg',S=64,MAX=30,HEAD=10;
const state=[0,0],els=[[],[]];
try{const s=JSON.parse(localStorage.getItem('truco-anotador'));if(Array.isArray(s))s.forEach((v,i)=>state[i]=Math.max(0,Math.min(MAX,v|0)))}catch(e){}
const SEG=[[0,0,0,S],[S,0,0,0],[S,S,S,0],[0,S,S,S],[S-3,5,7,S-7]];
function pos(p,team){const box=Math.floor(p/5),half=box>=3?1:0,row=box%3;return[team?437:218,(half?435:108)+row*96]}
function mk(tag,a){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);return e}
function jit(i,t,s){const v=Math.sin(i*12.9898+t*78.233)*43758.5453;return(v-Math.floor(v)-.5)*2*s}

function makeMatch(team,p){
  const M=THEMES[themeKey].mark,[bx,by]=pos(p,team),k=p%5,[x1,y1,x2,y2]=SEG[k],T=M.T;
  const hand=M.type!=='match',amp=hand?2.6:1.6;
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)+T+(hand?jit(p,team+3,2.5):0),ang=Math.atan2(dy,dx)*180/Math.PI;
  const outer=mk('g',{transform:`translate(${bx+x1+(hand?jit(p,team+9,1.8):0)},${by+y1+(hand?jit(p,team+5,1.8):0)}) rotate(${ang+jit(p,team,amp)})`});
  const g=mk('g',{class:'m'});
  if(M.type==='match'){
    g.append(mk('rect',{x:-T/2,y:-T/2,width:len,height:T,rx:2,fill:M.body}),
      mk('rect',{x:-T/2,y:T/2-1.6,width:len,height:1.6,rx:1,fill:M.shade}),
      mk('rect',{x:-T/2-1,y:-T/2-1.2,width:HEAD,height:T+2.4,rx:3,fill:M.head}),
      mk('rect',{x:-T/2+1,y:-T/2-.6,width:HEAD-4,height:1.6,rx:1,fill:M.hl}));
  }else{
    g.append(mk('rect',{x:-T/2,y:-T/2,width:len,height:T,rx:T/2,fill:M.body,opacity:M.type==='chalk'?.93:1}));
    if(M.type==='chalk')g.append(mk('rect',{x:-T/2+3,y:-T/2+1,width:len-6,height:1.2,rx:.6,fill:'#fff',opacity:.5}));
  }
  outer.append(g);return outer;
}
function sound(up){try{
  const A=sound.a||(sound.a=new(window.AudioContext||window.webkitAudioContext)());
  const t=A.currentTime,o=A.createOscillator(),gn=A.createGain();
  o.type='triangle';o.frequency.setValueAtTime(up?520:300,t);o.frequency.exponentialRampToValueAtTime(up?260:150,t+.07);
  gn.gain.setValueAtTime(.12,t);gn.gain.exponentialRampToValueAtTime(.001,t+.09);
  o.connect(gn).connect(A.destination);o.start(t);o.stop(t+.1)}catch(e){}}
function add(team,delay){
  const p=els[team].length;if(p>=MAX)return false;
  const m=makeMatch(team,p);m.firstChild.classList.add('in');
  if(delay)m.firstChild.style.animationDelay=delay+'ms';
  document.getElementById('g'+team).appendChild(m);els[team].push(m);return true}
function remove(team,delay){
  const m=els[team].pop();if(!m)return false;
  const g=m.firstChild;g.classList.remove('in');g.classList.add('out');
  if(delay)g.style.animationDelay=delay+'ms';
  setTimeout(()=>m.remove(),400+(delay||0));return true}
function save(){try{localStorage.setItem('truco-anotador',JSON.stringify(state))}catch(e){}}
function paintWin(){for(let t=0;t<2;t++)document.getElementById('l'+t).classList.toggle('win',state[t]>=MAX)}
function change(team,d){
  let ok=false;
  if(d>0){if(add(team)){state[team]++;sound(true);ok=true}}
  else if(remove(team)){state[team]--;sound(false);ok=true}
  if(ok)logG('truco',`${team?'Ellos':'Nos'} ${d>0?'+1':'−1'} → ${state[team]}`);
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
  save();paintWin()}

const TL=[];try{const s=JSON.parse(localStorage.getItem('truco-log'));if(Array.isArray(s))TL.push(...s)}catch(e){}
function logG(g,m){
  const a=g==='truco'?TL:G[g].log;a.push({t:Date.now(),m});
  if(a.length>300)a.splice(0,a.length-300);
  if(g==='truco')try{localStorage.setItem('truco-log',JSON.stringify(TL))}catch(e){}
}
const pad2=n=>String(n).padStart(2,'0');
function fmtT(ts){
  const d=new Date(ts),n=new Date(),t=`${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
  return d.toDateString()===n.toDateString()?t:`${pad2(d.getDate())}/${pad2(d.getMonth()+1)} ${t}`;
}
function openHist(){
  const a=(game==='truco'?TL:G[game].log).slice().reverse();
  $('#hT').textContent='Historial de puntos · '+GAMES[game];
  $('#hL').innerHTML=a.length?a.map(x=>`<div class="he"><time>${fmtT(x.t)}</time><span>${E(x.m)}</span></div>`).join('')
    :'<div class="he empty">Todavía no anotaste nada</div>';
  $('#hsheet').hidden=false;
}
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nameIn=(g,i)=>`<input class="nm" data-g="${g}" data-i="${i}" value="${E(G[g].names[i])}" maxlength="14" aria-label="Nombre">`;
const seg=(act,vals,cur,label)=>`<div class="seg"><span>${label}</span>${vals.map(v=>`<button class="b${v==cur?' on':''}" data-act="${act}" data-v="${v}">${v}</button>`).join('')}</div>`;

// --- Generala ---
const GROWS=[1,2,3,4,5,6].map(n=>({k:String(n),l:String(n),t:'Número '+n,o:[1,2,3,4,5].map(m=>m*n)})).concat([
  {k:'E',l:'Escalera',t:'Escalera',o:[20,25]},{k:'F',l:'Full',t:'Full',o:[30,35]},{k:'P',l:'Póker',t:'Póker',o:[40,45]},
  {k:'G',l:'Generala',t:'Generala',o:[50,'S']},{k:'D',l:'Doble gen.',t:'Doble generala',o:[100]}]);
const gv=(p,k)=>G.generala.cells[p+'-'+k];
const gTot=p=>GROWS.reduce((s,r)=>{const v=gv(p,r.k);return s+(v==='S'?50:(+v||0))},0);
function rGen(){
  const g=G.generala,P=[...Array(g.n).keys()],tot=P.map(gTot),mx=Math.max(...tot);
  const served=P.find(p=>gv(p,'G')==='S');
  const done=P.every(p=>GROWS.every(r=>gv(p,r.k)!==undefined));
  let ban='';
  if(served!==undefined)ban=`¡${E(g.names[served])} ganó con Generala servida!`;
  else if(done){const w=P.filter(p=>tot[p]===mx);ban=`${w.length>1?'Empatan':'Ganó'} ${w.map(p=>E(g.names[p])).join(' y ')} con ${mx}`}
  $('#vGenerala').innerHTML=`${seg('gn',[2,3,4],g.n,'Jugadores')}
   ${ban?`<div class="ban">${ban}</div>`:''}
   <div class="card"><table class="gt"><thead><tr><th></th>${P.map(p=>`<th>${nameIn('generala',p)}</th>`).join('')}</tr></thead><tbody>
   ${GROWS.map(r=>`<tr><td class="rl">${r.l}</td>${P.map(p=>{const v=gv(p,r.k);
     return `<td><button class="cell${v===0?' x':''}" data-act="cell" data-p="${p}" data-r="${r.k}">${v===undefined?'':v===0?'✕':v==='S'?'50★':v}</button></td>`}).join('')}</tr>`).join('')}
   <tr class="tot"><td class="rl">Total</td>${P.map(p=>`<td class="${tot[p]===mx&&mx>0?'lead':''}">${tot[p]}</td>`).join('')}</tr>
   </tbody></table></div>
   <div class="row"><button class="b" data-act="gnew">Nueva partida</button><button class="b" data-act="hist">Historial de puntos</button></div>`;
}
function openSheet(p,rk){
  const r=GROWS.find(x=>x.k===rk),cur=gv(p,rk),a=`data-act="setcell" data-p="${p}" data-r="${rk}"`;
  $('#sheetT').textContent=`${G.generala.names[p]} · ${r.t}`;
  $('#sheetB').innerHTML=r.o.map(v=>`<button class="b${cur===v?' on':''}" ${a} data-v="${v}">${v==='S'?'Servida · gana':v}</button>`).join('')
    +`<button class="b${cur===0?' on':''}" ${a} data-v="0">Tachar</button><button class="b" ${a} data-v="">Borrar</button>`;
  $('#sheet').hidden=false;
}

// --- Escoba de 15 ---
const ECATS=[['c','Más cartas'],['o','Más oros'],['s','Más sietes'],['v','Siete de oro']];
const ePts=()=>{const r=G.escoba.r;return[0,1].map(i=>r.esc[i]+ECATS.filter(([k])=>r[k]===i).length)};
function rEsc(){
  const g=G.escoba,r=g.r,pts=ePts(),mx=Math.max(...g.tot);
  const ban=mx>=g.target?(g.tot[0]===g.tot[1]?'Empate, sigan jugando':`¡${E(g.names[g.tot[0]>g.tot[1]?0:1])} ganó!`):'';
  $('#vEscoba').innerHTML=`${seg('etarget',[15,21],g.target,'Se juega a')}
   ${ban?`<div class="ban">${ban}</div>`:''}
   <div class="card two">${[0,1].map(i=>`<div class="pl">${nameIn('escoba',i)}<div class="big${g.tot[i]===mx&&mx>0?' lead':''}">${g.tot[i]}</div>
     <div class="pm"><button class="b sm" data-act="etot" data-i="${i}" data-d="-1">−</button><button class="b sm" data-act="etot" data-i="${i}" data-d="1">+</button></div></div>`).join('')}</div>
   <div class="card"><div class="t2">Mano actual</div>
    <div class="rw"><span>Escobas</span>${[0,1].map(i=>`<div class="ctr"><button class="b sm" data-act="eesc" data-i="${i}" data-d="-1">−</button><b>${r.esc[i]}</b><button class="b sm" data-act="eesc" data-i="${i}" data-d="1">+</button></div>`).join('')}</div>
    ${ECATS.map(([k,l])=>`<div class="rw"><span>${l}</span>${[0,1].map(i=>`<button class="b${r[k]===i?' on':''}" data-act="ecat" data-k="${k}" data-i="${i}">${E(g.names[i])}</button>`).join('')}</div>`).join('')}
    <div class="prev">Esta mano: ${E(g.names[0])} +${pts[0]} · ${E(g.names[1])} +${pts[1]}</div>
    <div class="row"><button class="b on" data-act="eend">Terminar mano</button><button class="b" data-act="eundo" ${g.hist.length?'':'disabled'}>Deshacer mano</button></div></div>
   ${g.hist.length?`<div class="card hist"><div class="t2">Manos</div>${g.hist.slice(-6).reverse().map((h,j)=>`<div>Mano ${g.hist.length-j}: ${E(g.names[0])} +${h.d[0]} · ${E(g.names[1])} +${h.d[1]}</div>`).join('')}</div>`:''}
   <div class="row"><button class="b" data-act="enew">Nueva partida</button><button class="b" data-act="hist">Historial de puntos</button></div>`;
}

// --- Chinchón ---
const cTot=()=>[...Array(G.chinchon.n).keys()].map(p=>G.chinchon.rounds.reduce((s,r)=>s+(r[p]||0),0));
function rChi(){
  const c=G.chinchon,P=[...Array(c.n).keys()],tot=cTot(),act=P.filter(p=>tot[p]<=c.limit);
  let ban='';
  if(c.rounds.length){
    if(act.length===1)ban=`¡${E(c.names[act[0]])} ganó!`;
    else if(!act.length){const m=Math.min(...tot);ban=`Ganó ${E(c.names[tot.indexOf(m)])} (menos puntos)`}
  }
  $('#vChinchon').innerHTML=`${seg('cn',[2,3,4],c.n,'Jugadores')}${seg('climit',[50,100],c.limit,'Se pasa de')}
   ${ban?`<div class="ban">${ban}</div>`:''}
   <div class="card"><table class="gt"><thead><tr>${P.map(p=>`<th>${nameIn('chinchon',p)}</th>`).join('')}</tr>
    <tr class="tot">${P.map(p=>`<td class="${tot[p]>c.limit?'out':''}">${tot[p]}${tot[p]>c.limit?'<small>Fuera</small>':''}</td>`).join('')}</tr></thead>
    <tbody>${c.rounds.map(r=>`<tr>${P.map(p=>`<td class="${r[p]<0?'neg':''}">${r[p]===null?'–':r[p]}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
   ${ban?'':`<div class="card"><div class="t2">Anotar mano</div>
    <div class="ins">${P.map(p=>tot[p]>c.limit?`<div class="in out">Fuera</div>`:`<div class="in"><input class="ni" type="number" inputmode="numeric" placeholder="0" data-i="${p}"><button class="b sm" data-act="cchip" data-i="${p}">−10</button></div>`).join('')}</div>
    <div class="row"><button class="b on" data-act="canot">Anotar mano</button></div></div>`}
   <div class="row"><button class="b" data-act="cundo" ${c.rounds.length?'':'disabled'}>Deshacer mano</button><button class="b" data-act="cnew">Nueva partida</button><button class="b" data-act="hist">Historial de puntos</button></div>`;
}

function renderGame(){
  if(game==='generala')rGen();else if(game==='escoba')rEsc();else if(game==='chinchon')rChi();
}
function setGame(g){
  game=g;document.body.dataset.game=g;
  $('#title').textContent=g==='truco'?'Anotador':GAMES[g];
  $('#sheet').hidden=true;$('#hsheet').hidden=true;renderGame();
}

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains('nm')){G[t.dataset.g].names[+t.dataset.i]=t.value;saveG()}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const d=b.dataset,a=d.act,i=+d.i,gen=G.generala,es=G.escoba,ch=G.chinchon;
  if(a==='closesheet'){$('#sheet').hidden=true;$('#hsheet').hidden=true;return}
  if(a==='hist'){openHist();return}
  if(a==='cell'){openSheet(+d.p,d.r);return}
  if(a==='cchip'){const inp=document.querySelector(`#vChinchon .ni[data-i="${i}"]`);if(inp)inp.value=-10;return}
  if(a==='setcell'){const k=d.p+'-'+d.r,row=GROWS.find(x=>x.k===d.r);
    logG('generala',`${gen.names[+d.p]} · ${row.t}: ${d.v===''?'borró':d.v==='0'?'tachó':d.v==='S'?'Servida (gana)':d.v}`);
    if(d.v==='')delete gen.cells[k];else gen.cells[k]=d.v==='S'?'S':+d.v;$('#sheet').hidden=true}
  else if(a==='gn')gen.n=+d.v;
  else if(a==='gnew'){if(!confirm('¿Empezar una partida nueva de Generala?'))return;gen.cells={};gen.log=[]}
  else if(a==='etarget')es.target=+d.v;
  else if(a==='etot'){es.tot[i]=Math.max(0,es.tot[i]+ +d.d);logG('escoba',`${es.names[i]} ${+d.d>0?'+1':'−1'} (manual) → ${es.tot[i]}`)}
  else if(a==='eesc'){es.r.esc[i]=Math.max(0,es.r.esc[i]+ +d.d);logG('escoba',`Escoba ${+d.d>0?'+1':'−1'} · ${es.names[i]} (esta mano: ${es.r.esc[i]})`)}
  else if(a==='ecat'){const was=es.r[d.k]===i;es.r[d.k]=was?-1:i;
    logG('escoba',`${ECATS.find(x=>x[0]===d.k)[1]}: ${was?'se sacó a ':''}${es.names[i]}`)}
  else if(a==='eend'){const p=ePts();es.tot[0]+=p[0];es.tot[1]+=p[1];es.hist.push({d:p});es.r={esc:[0,0],c:-1,o:-1,s:-1,v:-1};
    logG('escoba',`Mano terminada: ${es.names[0]} +${p[0]} (${es.tot[0]}) · ${es.names[1]} +${p[1]} (${es.tot[1]})`)}
  else if(a==='eundo'){const h=es.hist.pop();if(h){es.tot[0]=Math.max(0,es.tot[0]-h.d[0]);es.tot[1]=Math.max(0,es.tot[1]-h.d[1]);
    logG('escoba',`Deshizo la última mano (${es.tot[0]} - ${es.tot[1]})`)}}
  else if(a==='enew'){if(!confirm('¿Empezar una partida nueva de Escoba?'))return;es.tot=[0,0];es.hist=[];es.log=[];es.r={esc:[0,0],c:-1,o:-1,s:-1,v:-1}}
  else if(a==='cn'){if(ch.rounds.length&&!confirm('Se borran las manos anotadas. ¿Seguir?'))return;ch.n=+d.v;ch.rounds=[];ch.log=[]}
  else if(a==='climit')ch.limit=+d.v;
  else if(a==='canot'){
    const tot=cTot();
    ch.rounds.push([...Array(ch.n).keys()].map(p=>{
      if(tot[p]>ch.limit)return null;
      const inp=document.querySelector(`#vChinchon .ni[data-i="${p}"]`);return parseInt(inp&&inp.value,10)||0}));
    const last=ch.rounds[ch.rounds.length-1];
    logG('chinchon',`Mano ${ch.rounds.length}: `+last.map((v,p)=>`${ch.names[p]} ${v===null?'–':(v>0?'+':'')+v}`).join(' · '));
  }
  else if(a==='cundo'){if(ch.rounds.length){ch.rounds.pop();logG('chinchon','Deshizo la última mano')}}
  else if(a==='cnew'){if(!confirm('¿Empezar una partida nueva de Chinchón?'))return;ch.rounds=[];ch.log=[]}
  else return;
  saveG();renderGame();
});

// ---------- pantalla siempre encendida ----------
let wl=null;
async function keepAwake(){
  try{
    if(!('wakeLock' in navigator)||document.visibilityState!=='visible'||wl)return;
    wl=await navigator.wakeLock.request('screen');
    wl.addEventListener('release',()=>{wl=null});
  }catch(e){wl=null}
}
keepAwake();
document.addEventListener('visibilitychange',keepAwake);
addEventListener('pointerdown',keepAwake);

// ---------- app instalable ----------
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
