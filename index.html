<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Anotador de Truco</title>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:#1e120b;overflow:hidden}
  body{font-family:'Titillium Web',system-ui,sans-serif;color:#fff}
  #wood{position:fixed;inset:0;width:100%;height:100%;z-index:0}
  #app{position:relative;z-index:1;max-width:520px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;
       box-shadow:0 0 60px rgba(0,0,0,.7)}
  header{height:clamp(56px,9vh,76px);flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;
    border-bottom:2px solid #b8892c;
    background:
      radial-gradient(circle at 50% 120%,transparent 0 9px,rgba(255,200,90,.07) 10px 11px,transparent 12px) 0 0/26px 26px,
      radial-gradient(circle at 0% 100%,transparent 0 9px,rgba(255,200,90,.07) 10px 11px,transparent 12px) 0 0/26px 26px,
      #2b1a10}
  header h1{margin:0;font-weight:400;font-size:clamp(22px,5.4vw,28px);color:#f7c21c;letter-spacing:.3px}
  .ic{width:34px;height:34px;border:1.5px solid #b8892c;border-radius:50%;display:grid;place-items:center;opacity:.9}
  .ic svg{width:20px;height:20px;stroke:#d6a431;fill:none;stroke-width:1.6;stroke-linecap:round}
  main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center}
  #board{width:100%;flex:none;display:block;touch-action:manipulation}
  .lbl{font:400 46px 'Titillium Web',sans-serif;fill:#fff;text-anchor:middle}
  .gl{stroke:#9a7226;stroke-width:2.5}
  .btn circle{fill:rgba(0,0,0,.001);stroke:#fff;stroke-width:4.5;transition:fill .15s}
  .btn path{stroke:#fff;stroke-width:5;stroke-linecap:round;fill:none}
  .btn{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .12s}
  .btn:active{transform:scale(.88)}
  .btn:active circle{fill:rgba(255,255,255,.25)}
  .matches{filter:drop-shadow(0 2px 2px rgba(0,0,0,.65))}
  .m{transform-box:fill-box;transform-origin:center}
  .m.in{animation:drop .42s cubic-bezier(.2,.9,.3,1.25) both}
  .m.out{animation:away .34s ease-in forwards}
  @keyframes drop{0%{opacity:0;transform:translate(0,-34px) rotate(50deg) scale(1.6)}
                  60%{opacity:1}100%{opacity:1;transform:none}}
  @keyframes away{to{opacity:0;transform:translate(0,40px) rotate(-70deg) scale(.7)}}
  .win{animation:glow 1s ease-in-out infinite alternate}
  @keyframes glow{from{fill:#fff}to{fill:#ffd24a}}
  #spacer{flex:1}
  #nuevo{flex:none;margin-bottom:clamp(20px,5vh,54px);padding:9px 20px;font:400 18px 'Titillium Web',sans-serif;color:#fff;
    background:rgba(20,12,8,.85);border:1.5px solid #b8892c;border-radius:9px;cursor:pointer;transition:transform .12s,background .15s}
  #nuevo:active{transform:scale(.94);background:rgba(90,60,20,.9)}
</style>
</head>
<body>
<canvas id="wood"></canvas>
<div id="app">
  <header>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M19 12H6M11 6l-6 6 6 6"/></svg></div>
    <h1>Anotador</h1>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M6 8h12M6 12h12M6 16h12"/></svg></div>
  </header>
  <main>
    <svg id="board" viewBox="0 0 720 740" aria-label="Anotador de truco">
      <line class="gl" x1="150" y1="80" x2="570" y2="80"/>
      <line class="gl" x1="150" y1="398" x2="570" y2="398"/>
      <line class="gl" x1="360" y1="10" x2="360" y2="720"/>
      <text class="lbl" id="l0" x="255" y="62">Nos:</text>
      <text class="lbl" id="l1" x="465" y="62">Ellos:</text>
      <g class="matches" id="g0"></g>
      <g class="matches" id="g1"></g>
      <g class="btn" data-t="0" data-d="1"><circle cx="90" cy="355" r="36"/><path d="M72 355h36M90 337v36"/></g>
      <g class="btn" data-t="0" data-d="-1"><circle cx="90" cy="445" r="36"/><path d="M72 445h36"/></g>
      <g class="btn" data-t="1" data-d="1"><circle cx="630" cy="355" r="36"/><path d="M612 355h36M630 337v36"/></g>
      <g class="btn" data-t="1" data-d="-1"><circle cx="630" cy="445" r="36"/><path d="M612 445h36"/></g>
    </svg>
    <div id="spacer"></div>
    <button id="nuevo">Nuevo partido</button>
  </main>
</div>

<script>
// ---------- fondo de madera ----------
(function(){
  const c=document.getElementById('wood'),x=c.getContext('2d');
  function rng(s){return()=>(s=(s*16807)%2147483647)/2147483647}
  function draw(){
    const dpr=Math.min(devicePixelRatio||1,2),W=innerWidth,H=innerHeight;
    c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
    const r=rng(7);let px=0;
    while(px<W){
      const w=46+r()*60,l=14+r()*7;
      x.fillStyle=`hsl(${18+r()*6},${38+r()*10}%,${l}%)`;x.fillRect(px,0,w+1,H);
      // vetas
      for(let i=0;i<w/2.2;i++){
        const gx=px+r()*w,a=.05+r()*.12;
        x.strokeStyle=r()>.5?`rgba(0,0,0,${a})`:`rgba(255,190,120,${a*.5})`;
        x.lineWidth=.5+r()*1.4;x.beginPath();x.moveTo(gx,0);
        let yy=0;while(yy<H){yy+=60+r()*120;x.lineTo(gx+(r()-.5)*2.5,yy)}x.stroke();
      }
      // cortes horizontales de tablas
      let yy=r()*220;
      while(yy<H){x.fillStyle='rgba(0,0,0,.35)';x.fillRect(px,yy,w,1.5);
        x.fillStyle=`rgba(0,0,0,${r()*.12})`;x.fillRect(px,yy+1.5,w,H);yy+=180+r()*420}
      x.fillStyle='rgba(0,0,0,.55)';x.fillRect(px+w-1,0,2,H);
      px+=w;
    }
    const g=x.createRadialGradient(W/2,H/2,H*.2,W/2,H/2,H*.9);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.5)');
    x.fillStyle=g;x.fillRect(0,0,W,H);
  }
  draw();addEventListener('resize',draw);
})();

// ---------- anotador ----------
const NS='http://www.w3.org/2000/svg',S=64,T=5,HEAD=10;
const state=[0,0],els=[[],[]],MAX=30;
try{const s=JSON.parse(localStorage.getItem('truco-anotador'));if(Array.isArray(s))s.forEach((v,i)=>state[i]=Math.max(0,Math.min(MAX,v|0)))}catch(e){}

// segmentos de cada fosforo: [x1,y1,x2,y2] (cabeza en x1,y1)
const SEG=[[0,0,0,S],[S,0,0,0],[S,S,S,0],[0,S,S,S],[S-3,5,7,S-7]];

function pos(p,team){
  const box=Math.floor(p/5),half=box>=3?1:0,row=box%3;
  return [team?437:218,(half?435:108)+row*96];
}
function mk(tag,a){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);return e}
function jitter(i,t){return Math.sin(i*12.9898+t*78.233)*43758.5453%1}

function makeMatch(team,p){
  const [bx,by]=pos(p,team),k=p%5,[x1,y1,x2,y2]=SEG[k];
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)+(k==4?0:T),ang=Math.atan2(dy,dx)*180/Math.PI;
  const j=jitter(p,team)*1.6;
  const outer=mk('g',{transform:`translate(${bx+x1+(k==4?0:0)},${by+y1}) rotate(${ang+j})`});
  const g=mk('g',{class:'m'});
  const body=mk('rect',{x:-T/2,y:-T/2,width:len,height:T,rx:2,fill:'#ecd9a8'});
  const shade=mk('rect',{x:-T/2,y:T/2-1.6,width:len,height:1.6,rx:1,fill:'#b9a06a'});
  const head=mk('rect',{x:-T/2-1,y:-T/2-1.2,width:HEAD,height:T+2.4,rx:3,fill:'#c8281c'});
  const hl=mk('rect',{x:-T/2+1,y:-T/2-.6,width:HEAD-4,height:1.6,rx:1,fill:'#ff6a4a'});
  g.append(body,shade,head,hl);outer.append(g);
  return outer;
}

function sound(up){
  try{
    const A=sound.a||(sound.a=new (window.AudioContext||window.webkitAudioContext)());
    const t=A.currentTime,o=A.createOscillator(),gn=A.createGain();
    o.type='triangle';o.frequency.setValueAtTime(up?520:300,t);o.frequency.exponentialRampToValueAtTime(up?260:150,t+.07);
    gn.gain.setValueAtTime(.12,t);gn.gain.exponentialRampToValueAtTime(.001,t+.09);
    o.connect(gn).connect(A.destination);o.start(t);o.stop(t+.1);
  }catch(e){}
}

function add(team,delay){
  const p=els[team].length;if(p>=MAX)return false;
  const m=makeMatch(team,p);m.firstChild.classList.add('in');
  if(delay)m.firstChild.style.animationDelay=delay+'ms';
  document.getElementById('g'+team).appendChild(m);els[team].push(m);return true;
}
function remove(team,delay){
  const m=els[team].pop();if(!m)return false;
  const g=m.firstChild;g.classList.remove('in');g.classList.add('out');
  if(delay)g.style.animationDelay=delay+'ms';
  setTimeout(()=>m.remove(),400+(delay||0));return true;
}
function save(){try{localStorage.setItem('truco-anotador',JSON.stringify(state))}catch(e){}}
function paintWin(){for(let t=0;t<2;t++)document.getElementById('l'+t).classList.toggle('win',state[t]>=MAX)}

function change(team,d){
  if(d>0){if(add(team)){state[team]++;sound(true)}}
  else if(remove(team)){state[team]--;sound(false)}
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
  save();paintWin();
}

document.querySelectorAll('.btn').forEach(b=>{
  b.addEventListener('click',()=>change(+b.dataset.t,+b.dataset.d));
});
document.getElementById('nuevo').addEventListener('click',()=>{
  for(let t=0;t<2;t++){const n=els[t].length;for(let i=0;i<n;i++)remove(t,(n-1-i)*22);state[t]=0}
  sound(false);save();paintWin();
});

// estado inicial (sin animar de a uno: entran escalonados)
for(let t=0;t<2;t++)for(let i=0;i<state[t];i++)add(t,i*30);
paintWin();
</script>
</body>
</html>
